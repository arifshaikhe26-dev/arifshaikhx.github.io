<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Arif Shaikh, QA fresher in Pune: manual testing, Selenium with Java and TestNG, Postman API testing, SQL and JIRA.">
<title>Arif Shaikh – QA Fresher | Manual &amp; Automation Testing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fbfcfe;--ink:#0b1220;--mute:#546078;--line:#d3dae6;--accent:#3a4cf0;--glow:rgba(58,76,240,.14);--pass:#15803d;--fail:#d62839;--warn:#b45309;--on-accent:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080b16;--card:#101627;--ink:#e8edf7;--mute:#97a3ba;--line:#222c44;--accent:#8394ff;--glow:rgba(131,148,255,.16);--pass:#4ade80;--fail:#ff6b78;--warn:#fbbf24;--on-accent:#080b16;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080b16;--card:#101627;--ink:#e8edf7;--mute:#97a3ba;--line:#222c44;--accent:#8394ff;--glow:rgba(131,148,255,.16);--pass:#4ade80;--fail:#ff6b78;--warn:#fbbf24;--on-accent:#080b16;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "IBM Plex Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;line-height:1.05}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
#bar{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:30;animation:prog linear;animation-timeline:scroll()}
@keyframes prog{to{transform:scaleX(1)}}
/* floating pill nav */
.pill{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:25;display:flex;align-items:center;gap:4px;padding:6px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);max-width:calc(100% - 24px)}
.pill a,.pill button{font:500 14px "IBM Plex Sans",sans-serif;text-decoration:none;color:var(--mute);padding:8px 13px;border-radius:99px;border:0;background:none;cursor:pointer;white-space:nowrap}
.pill a:hover,.pill button:hover{color:var(--ink);background:var(--glow)}
.pill a.cv{background:var(--accent);color:var(--on-accent)}
@media(max-width:560px){.pill a.l{display:none}}
.hero{padding:120px 0 24px}
.avail{display:inline-flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:5px 14px;background:var(--card)}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--pass);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent;opacity:.5}}
.hero h1{font-size:clamp(48px,11vw,132px);font-weight:800;letter-spacing:-.035em;margin:22px 0 0}
.hero h1 span{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 span i{display:block;font-style:normal;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2) i{animation-delay:.12s;color:var(--accent)}
@keyframes up{to{transform:none}}
.hero p{max-width:600px;color:var(--mute);font-size:19px;margin:22px 0 0}
.scope{margin-top:36px;border:1px solid var(--line);border-radius:20px;background:var(--card);position:relative;overflow:hidden}
.scope canvas{display:block;width:100%;height:210px}
.scope small{position:absolute;left:18px;top:12px;color:var(--mute);font-size:13px}
#flag{position:absolute;right:18px;top:12px;font-size:13px;font-weight:500}
/* bento */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px}
.c{position:relative;border:1px solid var(--line);border-radius:20px;background:var(--card);padding:26px;overflow:hidden;isolation:isolate}
.c::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),var(--glow),transparent 70%)}
.c:hover::before{opacity:1}
.c h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
.s6{grid-column:span 6}.s4{grid-column:span 4}.s3{grid-column:span 3}.s2{grid-column:span 2}
@media(max-width:820px){.s4,.s3,.s2{grid-column:span 6}}
.c p{margin:0 0 12px;color:var(--mute)}
dl{margin:0}dt{color:var(--mute);font-size:14px}dd{margin:0 0 12px;font-weight:500}
.run{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.run button,.copy{font:500 15px "IBM Plex Sans",sans-serif;cursor:pointer;background:var(--ink);color:var(--bg);border:0;padding:10px 20px;border-radius:99px}
#sum{color:var(--mute);font-size:15px}
.tests{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.row{display:grid;grid-template-columns:1fr 2fr 110px;gap:16px;padding:13px 18px;border-bottom:1px solid var(--line);min-width:540px}
.row:last-child{border:0}.row .k{font-weight:500}.row .d{color:var(--mute);font-size:15px}
.st{font-weight:500;color:var(--mute);text-align:right}.st.pass{color:var(--pass)}.st.run{color:var(--accent)}
.c h3{font-size:23px;margin-bottom:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tags span{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:2px 11px}
.c a.go{font-weight:500;color:var(--accent)}
.big{font:800 clamp(24px,5vw,50px)/1.1 "Bricolage Grotesque",sans-serif;text-decoration:none;word-break:break-all}
.big:hover{color:var(--accent)}
.links{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 0}
footer{padding:36px 0 28px;color:var(--mute);font-size:14px}
@media(prefers-reduced-motion:reduce){.hero h1 span i{animation:none;transform:none}html{scroll-behavior:auto}.avail i{animation:none}#bar{animation:none}.c::before{transition:none}}
</style>
</head>
<body>
<div id="bar"></div>
<nav class="pill" aria-label="Main"><a class="l" href="#about">About</a><a class="l" href="#skills">Skills</a><a class="l" href="#projects">Projects</a><a href="#contact">Contact</a><a class="cv" id="cv" hidden target="_blank" rel="noopener">Resume</a><button id="th" aria-label="Switch light or dark theme">Theme</button></nav>

<header class="hero"><div class="wrap">
<span class="avail"><i></i><span id="avail"></span></span>
<h1><span><i id="h1a"></i></span><span><i id="h1b"></i></span></h1>
<p id="tag"></p>
<div class="scope" role="img" aria-label="Animated signal waveform where a glitch appears and is flagged as a failure."><small>Signal under test</small><span id="flag">PASS</span><canvas id="cvs"></canvas></div>
</div></header>

<main class="wrap"><div class="bento">
<section class="c s4" id="about"><h2>About</h2><div id="bio"></div></section>
<section class="c s2"><h2>Quick facts</h2><dl id="facts"></dl></section>
<section class="c s6" id="skills"><h2>Skills</h2>
<div class="run"><span id="sum">Ready. Run the suite to check every skill.</span><button id="go">Run all tests</button></div>
<div class="tests" id="tests"></div></section>
</div>
<div class="bento" id="projects"></div>
<div class="bento"><section class="c s6" id="contact"><h2>Let’s work together</h2><p id="ctxt"></p>
<a class="big" id="mail"></a><div class="links" id="links"></div><p style="margin-top:18px"><button class="copy" id="cp">Copy email</button></p></section></div>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
/* ============ EDIT YOUR DETAILS HERE ============ */
const DATA={
 name:"Arif Shaikh", first:"Arif", last:"Shaikh",
 role:"QA Fresher | Manual & Automation Testing",
 available:"Open to QA intern and fresher roles",
 tagline:"Electronics & Telecommunication engineer who tests web apps end to end: test cases, JIRA defects, Selenium automation, Postman API checks and SQL data validation.",
 bio:["I’m a 2026 B.E. graduate in Electronics & Telecommunication from JSPM Jayawantrao Sawant College of Engineering, Pune. I trained in manual testing at QSpiders and spent 3 months as a Web Technologies Intern at Techmaster Private Limited.","I write positive and negative test cases, log clear defects in JIRA, automate core flows with Selenium and Java, test REST APIs in Postman, and check data with SQL. I want a QA intern role where I can test features and help ship stable releases."],
 facts:[["Degree","B.E. Electronics & Telecommunication, 2026"],["Experience","3-month Web Technologies Intern"],["Training","QSpiders, software testing"],["Location","Pune, India"]],
 skills:[
  ["Manual testing","Functional and regression testing, SDLC, STLC, bug life cycle, test cases"],
  ["Automation","Selenium WebDriver, Java, TestNG, locators, waits, assertions"],
  ["API testing","Postman, REST (GET, POST, PUT, DELETE), status codes, JSON"],
  ["SQL","SELECT, JOIN, WHERE, GROUP BY, data integrity checks"],
  ["Defect tools","JIRA, Git, GitHub, MS Excel"],
  ["Web basics","HTML, CSS, how web applications work"]],
 projects:[
  {t:"Shopping Website Testing",d:"Manual and automated testing of login, cart and checkout. 30+ test cases in Excel, defects logged in JIRA, Selenium and TestNG scripts, and regression runs after fixes.",tags:["Selenium","Java","TestNG","JIRA"],link:"https://github.com/ARIFSHAIKHx/shopping-website-testing"},
  {t:"API Testing with Postman",d:"Tested GET, POST, PUT and DELETE requests, checking status codes, response body and time. Positive and negative cases organised in a Postman collection with test scripts.",tags:["Postman","REST","JSON"],link:"https://github.com/ARIFSHAIKHx/postman-api-testing"},
  {t:"Database Testing with SQL",d:"Validated user, product and order tables with SQL. Found duplicate records, null values and mismatches between UI results and database records.",tags:["MySQL","SQL"],link:"https://github.com/ARIFSHAIKHx/sql-database-testing"}],
 email:"arifshaikhxt@gmail.com",
 resume:"",           /* paste a link to your resume PDF; empty hides the button */
 links:[["LinkedIn","https://linkedin.com/in/arif-shaikh-199807269"],["GitHub","https://github.com/ARIFSHAIKHx"]],
 contact:"Send me a role, a project, or a bug you can’t crack."
};
/* ================================================= */
const $=i=>document.getElementById(i),mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e};
document.title=DATA.name+" – "+DATA.role;
$("h1a").textContent=DATA.first;$("h1b").textContent=DATA.last;$("tag").textContent=DATA.tagline;$("avail").textContent=DATA.available;
DATA.bio.forEach(t=>$("bio").append(mk("p","",t)));
DATA.facts.forEach(f=>$("facts").append(mk("dt","",f[0]),mk("dd","",f[1])));
DATA.skills.forEach(s=>{const r=mk("div","row");r.append(mk("span","k",s[0]),mk("span","d",s[1]),mk("span","st","Pending"));$("tests").append(r)});
DATA.projects.forEach((p,i)=>{const c=mk("article","c s2");c.append(mk("h3","",p.t),mk("p","",p.d));const g=mk("div","tags");p.tags.forEach(t=>g.append(mk("span","",t)));c.append(g);
 if(p.link){const a=mk("a","go","View project");a.href=p.link;a.target="_blank";a.rel="noopener";c.append(a)}$("projects").append(c)});
$("ctxt").textContent=DATA.contact;$("mail").textContent=DATA.email;$("mail").href="mailto:"+DATA.email;
DATA.links.forEach(l=>{if(!l[1])return;const a=mk("a","",l[0]);a.href=l[1];a.target="_blank";a.rel="noopener";$("links").append(a)});
if(DATA.resume){$("cv").href=DATA.resume;$("cv").hidden=false}
$("foot").textContent="© "+new Date().getFullYear()+" "+DATA.name;
$("cp").onclick=async()=>{try{await navigator.clipboard.writeText(DATA.email);$("cp").textContent="Copied"}catch(e){$("cp").textContent="Press and hold the email to copy"}setTimeout(()=>$("cp").textContent="Copy email",2000)};

/* theme toggle */
$("th").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};

/* spotlight follows cursor on cards */
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".c");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")}});

/* skill test run */
let busy=false;
$("go").onclick=()=>{if(busy)return;busy=true;const rows=[...document.querySelectorAll(".row .st")];let n=0;
 rows.forEach(s=>{s.textContent="Pending";s.className="st"});$("sum").textContent="Running…";
 rows.forEach((s,i)=>{setTimeout(()=>{s.textContent="Running";s.className="st run"},i*450);
  setTimeout(()=>{s.textContent="PASS";s.className="st pass";n++;$("sum").textContent=n+" of "+rows.length+" passed";if(n===rows.length){busy=false;$("sum").textContent="All "+n+" tests passed."}},i*450+380)})};

/* oscilloscope */
const cv=$("cvs"),cx=cv.getContext("2d"),flag=$("flag"),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let W,H,mx=.5,t=0,reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){const r=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0)}
size();addEventListener("resize",size);
cv.addEventListener("pointermove",e=>{mx=(e.clientX-cv.getBoundingClientRect().left)/W});
function draw(){
 cx.clearRect(0,0,W,H);cx.strokeStyle=css("--line");cx.lineWidth=1;
 for(let x=0;x<W;x+=40){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
 for(let y=0;y<H;y+=40){cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
 const f=.012+mx*.02,cyc=t%420,gx=W*.62,show=cyc>150&&cyc<330;
 cx.beginPath();
 for(let x=0;x<=W;x++){let y=H/2+Math.sin(x*f-t*.05)*(H*.28);if(show&&Math.abs(x-gx)<14)y-=Math.cos((x-gx)/14*Math.PI/2)*H*.34;x?cx.lineTo(x,y):cx.moveTo(x,y)}
 cx.strokeStyle=css("--accent");cx.lineWidth=2.5;cx.stroke();
 if(show){cx.strokeStyle=css("--fail");cx.lineWidth=1.5;cx.setLineDash([5,5]);cx.strokeRect(gx-26,14,52,H-28);cx.setLineDash([])}
 flag.textContent=show?"FAIL: glitch detected":"PASS";flag.style.color=show?css("--fail"):css("--pass");
 if(!reduce){t++;requestAnimationFrame(draw)}
}
draw();
</script>
</body>
</html>
